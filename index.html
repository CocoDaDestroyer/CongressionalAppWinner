<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CartWise compares grocery prices per ounce across nearby stores and brands, and tells you whether the cheap store is worth the drive." />
    <meta name="theme-color" content="#f5f0e6" />
    <title>CartWise</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var t = localStorage.getItem('cartwise.theme')
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
